# All images and containers:
services:

  # MongoDB container:
  mongo:
    image: mongo:7
    container_name: vacations-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # Healthcheck - constantly check if our service is working well:
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Backend container:
  backend:
    # Which other services we're depending on, so wait for them:
    depends_on:
      mongo:
        condition: service_healthy
    build: ./Backend
    container_name: vacations-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_CONNECTION_STRING: mongodb://mongo:27017/vacations-db
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      HASH_SALT: ${HASH_SALT:-change-this-salt-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VACATION_IMAGES_BASE_URL: http://localhost:4000/api/vacations/images/
      CLIENT_URL: http://localhost:5173
    healthcheck:
      test: ["CMD", "node", "--eval", "require('http').get('http://localhost:4000/ping', response => process.exit(response.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-off seed job (safe to run again: only fills an empty database and repairs the demo accounts):
  seed:
    depends_on:
      mongo:
        condition: service_healthy
    build: ./Backend
    container_name: vacations-seed
    environment:
      MONGODB_CONNECTION_STRING: mongodb://mongo:27017/vacations-db
      HASH_SALT: ${HASH_SALT:-change-this-salt-in-production}
    command: ["npx", "ts-node-dev", "--transpile-only", "src/seed.ts"]
    restart: "no"

  # Frontend container:
  frontend:
    depends_on:
      backend:
        condition: service_healthy
    build: ./Frontend
    container_name: vacations-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    healthcheck:
      test: ["CMD", "node", "--eval", "require('http').get('http://127.0.0.1:5173', response => process.exit(response.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# List of all our named-volumes:
volumes:
  mongo-data:
